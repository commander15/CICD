name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual trigger

env:
  # Package settings
  PACKAGE_NAME: 
  PACKAGE_VERSION: 
  # Release
  RELEASE_NOTE_FILE: examples
  # CMake settings
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_TYPE: Release
  CMAKE_BUILD_DIR: ${{github.workspace}}/build
  CMAKE_BUILD_COMMAND: cmake --build ${{env.CMAKE_BUILD_DIR}}
  # CPack settings
  CPACK_PACKAGE_DIR: ${{env.CMAKE_BUILD_DIR}}/release
  # Qt settings
  QT_VERSION: 6.9.0
  QT_TOOLS: ''
  QT_IFW_VERSION: 

jobs:
  cross-build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            host: windows
            arch: win64_msvc2022_64
            artifact_suffix: windows

          - os: ubuntu-latest
            name: Linux
            host: linux
            arch: linux_gcc_64
            artifact_suffix: linux

    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.name }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install CMake & Ninja (Windows)
      if: matrix.host == 'windows'
      run: choco install -y cmake ninja

    - name: Install CMake & Ninja (Linux)
      if: matrix.host == 'ubuntu'
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build libgl1-mesa-dev

    - name: Cache Qt
      uses: actions/cache@v4
      with:
        path: ~/Qt
        key: qt-${{ env.QT_VERSION }}-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          qt-${{ env.QT_VERSION }}-${{ matrix.os }}-

    - name: Install Qt
      id: install-qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: ${{ matrix.host }}
        target: desktop
        arch: ${{ matrix.arch }}
        tools: ${{ env.QT_TOOLS }}
        install-deps: 'true'
        cached: 'true'
        dir: ~/Qt

    - name: Find Qt IFW Path
      run: |
        IFW_PATH="${{ steps.install-qt.outputs.installed-path }}/Tools/QtInstallerFramework/${{ env.QT_IFW_VERSION }}"
        echo "IFW_DIR=$IFW_PATH" >> $GITHUB_ENV
        echo "IFW_DIR=$IFW_PATH" >> $GITHUB_OUTPUT
      shell: bash

    - name: Setup MSVC (Windows only)
      if: matrix.host == 'windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory
      run: cmake -G ${{env.CMAKE_GENERATOR}} -B ${{env.CMAKE_BUILD_DIR}} -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} -DCPACK_PACKAGE_DIRECTORY=${{env.CPACK_PACKAGE_DIR}} -DQTIFWDIR=${{env.IFW_DIR}}

    - name: Build
      # Try building first
      run: ${{env.CMAKE_BUILD_COMMAND}} --target all

    - name: Test
      # Running tests
      run: ${{env.CMAKE_BUILD_COMMAND}} --target test

    - name: Package
      # Packaging programs and libraries
      run: ${{env.CMAKE_BUILD_COMMAND}} --target package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_suffix }}
        path: ${{env.CPACK_PACKAGE_DIR}}/${{env.PACKAGE_NAME}}*
        if-no-files-found: error

  release:
    needs: cross-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Create Artifacts Directory
      run: mkdir -p artifacts

    - name: Download All Artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts

    - name: List Downloaded Artifacts
      run: |
        echo "Artifacts downloaded:"
        find artifacts -type f | sort || true

    - name: Flatten & Prepare Release Assets
      run: |
        mkdir -p release-assets
        find artifacts -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" \) -exec cp {} release-assets/ \;
        ls -lh release-assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.PACKAGE_VERSION }}
        name: ${{ env.PACKAGE_NAME }} ${{ env.PACKAGE_VERSION }}
        body_path: ${{ env.RELEASE_NOTE_FILE }}
        draft: false
        prerelease: false
        files: |
          release-assets/*
        fail_on_unmatched_files: true
